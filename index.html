<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Terror Swipe">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Terror Swipe</title>
  <style>
    :root{--bg:#100d12;--panel:#19151d;--card:#201a24;--fg:#f7f1f8;--mut:#a99dac;--ok:#36b66b;--no:#e05245;--accent:#ff8a3d;--line:rgba(255,255,255,.12);--shadow:0 18px 50px rgba(0,0,0,.48);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#34203a 0,#160f19 35%,var(--bg) 70%);color:var(--fg)}
    body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
    button{font:inherit}
    .app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;gap:12px;flex:0 0 auto}
    .brand{min-width:0}.brand h1{font-size:18px;margin:0;font-weight:850;letter-spacing:.2px}.brand p{font-size:12px;color:var(--mut);margin:3px 0 0}
    .tabs{display:flex;gap:6px;background:rgba(255,255,255,.055);padding:4px;border-radius:999px}
    .tabs button{border:0;background:transparent;color:var(--mut);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:750}
    .tabs button.on{background:#fff;color:#171219;box-shadow:0 3px 12px rgba(0,0,0,.25)}
    #cardsView{flex:1;min-height:0;display:flex;flex-direction:column}
    #stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 18px 8px}
    .card{position:absolute;width:min(calc(100% - 36px),350px);height:min(calc(100% - 16px),525px);max-height:72dvh;border-radius:26px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);touch-action:pan-y;user-select:none;cursor:grab;border:1px solid rgba(255,255,255,.11);transform-origin:center 90%}
    .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#251f28}
    .posterShade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.02) 35%,rgba(0,0,0,.25) 58%,rgba(0,0,0,.92) 100%)}
    .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:linear-gradient(155deg,#57233d,#19141c);padding:28px;text-align:center}.fallback .emoji{font-size:86px}.fallback b{font-size:25px;line-height:1.12}
    .meta{position:absolute;left:20px;right:20px;bottom:20px;text-align:left;text-shadow:0 2px 10px #000}.meta h2{font-size:27px;line-height:1.05;margin:0 0 7px;font-weight:900}.meta p{margin:0;color:#e2d9e5;font-size:13px}.meta .year{display:inline-flex;border:1px solid rgba(255,255,255,.45);padding:3px 7px;border-radius:999px;margin-right:6px;font-weight:700}
    .num{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.58);backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.18);padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}
    .tag{position:absolute;top:34px;font-weight:950;font-size:24px;border:3px solid;border-radius:10px;padding:4px 10px;opacity:0;background:rgba(0,0,0,.28);backdrop-filter:blur(4px)}.tag.l{left:18px;color:#6eff9f;transform:rotate(-12deg)}.tag.r{right:18px;color:#ff8278;transform:rotate(12deg)}
    #msg{text-align:center;color:var(--mut);padding:30px 18px;font-weight:700}
    .hint{text-align:center;color:var(--mut);font-size:11px;padding:0 16px 5px;flex:0 0 auto}
    .bar{display:grid;grid-template-columns:1fr 54px 1fr;gap:10px;padding:8px 16px 16px;flex:0 0 auto}.bar button{border:0;border-radius:18px;min-height:52px;color:#fff;font-weight:850;box-shadow:0 8px 20px rgba(0,0,0,.18)}#bSeen{background:var(--ok)}#bNo{background:var(--no)}#bUndo{background:#625866;font-size:21px}
    #listView{display:none;flex:1;min-height:0;overflow:auto;padding:4px 14px 24px}.listTop{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 76%,transparent);padding:4px 2px 12px}.progress{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#f17148,#d84d75);width:0}.summary{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:7px}
    .movieRow{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}.thumb{width:54px;height:78px;border-radius:9px;object-fit:cover;background:#2b242d}.rowText{min-width:0}.rowText b{display:block;font-size:14px;line-height:1.25}.rowText small{color:var(--mut)}.status{font-size:12px;font-weight:850;border:1px solid var(--line);padding:6px 8px;border-radius:999px;color:var(--mut)}.status.seen{color:#80e8a6;border-color:rgba(54,182,107,.45);background:rgba(54,182,107,.08)}
    .reset{display:block;margin:18px auto 4px;border:1px solid rgba(224,82,69,.55);background:transparent;color:#ff8278;border-radius:999px;padding:9px 14px;font-weight:750}
    .credit{text-align:center;color:#786d7c;font-size:10px;line-height:1.35;margin:16px auto 4px;max-width:310px}.credit a{color:#a99dac}
    @media (max-height:650px){.card{height:min(calc(100% - 8px),430px)}.meta h2{font-size:23px}.bar button{min-height:47px}.hint{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>🎃 Terror Swipe</h1><p id="cnt">0/31 vistas</p></div>
    <div class="tabs"><button id="tCards" class="on">Tarjetas</button><button id="tList">Lista</button></div>
  </header>
  <section id="cardsView">
    <div id="stage"><div id="msg"></div></div>
    <div class="hint">Desliza ← si la has visto · → si queda pendiente</div>
    <div class="bar"><button id="bSeen">← Vista</button><button id="bUndo" aria-label="Deshacer">↺</button><button id="bNo">Pendiente →</button></div>
  </section>
  <section id="listView"></section>
</div>
<script>
const IMG='https://image.tmdb.org/t/p/w500';
const MOVIES}[
 {title:'Pesadilla antes de Navidad',year:1993,emoji:'🎄',poster:'/kBwmwfQEkObrnsc6whcNE5Kh2Wr.jpg'},
 {title:'American Psycho',year:2000,emoji:'🪓',poster:'/193HQFVEhkWywhGjvu9R1FiikqP.jpg'},
 {title:'Scream',year:1996,emoji:'🔪',poster:'/lr9ZIrmuwVmZhpZuTCW8D9g0ZJe.jpg'},
 {title:'La familia Addams',year:1991,emoji:'🕸️',poster:'/sFwaszCIbVXGnsJG6dg6WUY7d6P.jpg'},
 {title:'Se lo hicisteis el último verano',year:1997,emoji:'🎣',poster:'/nBXwFJOp3Qlmk6ZDKl1PLCDh0FC.jpg'},
 {title:'Monster House',year:2006,emoji:'🏚️',poster:'/4urWOtrhlS9Oz4DPtubje4VAwko.jpg'},
 {title:'Pesadilla en Elm Street',year:1984,emoji:'🧤',poster:'/wGTpGGRMZmyFCcrY2YoxVTIBlli.jpg'},
 {title:'La matanza de Texas',year:1974,emoji:'⛓️',poster:'/9s8uSm5K1W0vhGPHv2icM6SFib8.jpg'},
 {title:'Viernes 13',year:1980,emoji:'🏒',poster:'/o1NuePMWEBuqsJgpkCNJjl2YbuL.jpg'},
 {title:'It',year:2017,emoji:'🎈',poster:'/9E2y5Q7WlCVNEhP5GiVTjhEhx1o.jpg'},
 {title:'Coraline',year:2009,emoji:'🪡',poster:'/4jeFXQYytChdZYE9JYO7Un87IlW.jpg'},
 {title:'Truco o trato',year:2007,emoji:'🍬',poster:'/webZHgUQZ7xAH8zYxvrn9PRubbj.jpg'},
 {title:'Hereditary',year:2018,emoji:'👑',poster:'/6chE8jSfzggAudaHmKodzBz8Sl.jpg'},
 {title:'La novia cadáver',year:2005,emoji:'💀',poster:'/3ALM0VeZjGUryAqWo6pqohzbLDh.jpg'},
 {title:'Eduardo Manostijeras',year:1990,emoji:'✂️',poster:'/e0FqKFvGPdQNWG8tF9cZBtev9Em.jpg'},
 {title:'Us',year:2019,emoji:'🐰',poster:'/tzYh66Yks8moOI5jMzSeDqLjLgj.jpg'},
 {title:'Mary Shelley',year:2017,emoji:'⚡',poster:'/keF84Cc8Ds2pqbaGVW0lor0xA4.jpg'},
 {title:'Saw',year:2004,emoji:'🧩',poster:'/8UZvCj5zTr0Kydjgenw6Rl0VHoo.jpg'},
 {title:'Sombras tenebrosas (Sleepy Hollow)',year:1999,emoji:'🎃',poster:'/1GuK965FLJxqUw9fd1pmvjbFAlv.jpg'},
 {title:'Los otros',year:2001,emoji:'🕯️',poster:'/p8g1vlTvpM6nr2hMMiZ1fUlKF0D.jpg'},
 {title:'The Ring',year:2002,emoji:'📼',poster:'/4TPPSB8OAtgYo9EdFzr7tsTsLDB.jpg'},
 {title:'It Follows',year:2014,emoji:'🚶',poster:'/iwnQ1JH1wdWrGYkgWySptJ5284A.jpg'},
 {title:'El silencio de los corderos',year:1991,emoji:'🦋',poster:'/uS9m8OBk1A8eM9I042bx8XXpqAq.jpg'},
 {title:'Barbarian',year:2022,emoji:'🚪',poster:'/idT5mnqPcJgSkvpDX7pJffBzdVH.jpg'},
 {title:'Verónica',year:2017,emoji:'🔮',poster:'/lU2HL58AWbQ8bWSyc7mqyDxkdvt.jpg'},
 {title:'Candyman',year:1992,emoji:'🐝',poster:'/n38YbNqUf5KWpMJFc4X3t0rlhg5.jpg'},
 {title:'Psicosis',year:1960,emoji:'🚿',poster:'/3md49VBCeqY6MSNyAVY6d5eC6bA.jpg'},
 {title:'El resplandor',year:1980,emoji:'🪓',poster:'/yQ7AR0T0dFJcEfR9g4J8vyeiHCl.jpg'},
 {title:'Drácula',year:1992,emoji:'🧛',poster:'/n39glC4GkBeCbwdenES8ZBodim8.jpg'},
 {title:'Noche de Halloween',year:1978,emoji:'🔦',poster:'/wijlZ3HaYMvlDTPqJoTCWKFkCPU.jpg'},
 {title:'Expediente Warren',year:2013,emoji:'✝️',poster:'/wVYREutTvI2tmxr6ujrHT704wGF.jpg'}
];
const N=MOVIES.length;
let seen=new Set(),cur=-1,hist=[];
try{
 const modern=JSON.parse(localStorage.getItem('terrorSwipe.seen')||'null');
 const legacy=JSON.parse(localStorage.getItem('seen')||'[]');
 seen=new Set(Array.isArray(modern)?modern:(Array.isArray(legacy)?legacy:[]));
}catch(e){}
const $=id=>document.getElementById(id),stage=$('stage');
function save(){try{localStorage.setItem('terrorSwipe.seen',JSON.stringify([...seen]));localStorage.setItem('seen',JSON.stringify([...seen]))}catch(e){}}
function nextIdx(from){for(let k=1;k<=N;k++){const i=(from+k)%N;if(!seen.has(i))return i}return -1}
function count(){ $('cnt').textContent=`${seen.size}/${N} vistas`; }
function posterError(img){img.style.display='none'; const f=img.parentElement.querySelector('.fallback'); if(f)f.style.display='flex';}
function show(){
 stage.querySelectorAll('.card').forEach(c=>c.remove()); count();
 if(cur<0||seen.size===N){$('msg').textContent=seen.size===N?'¡Las has visto todas! 🎉':'No quedan tarjetas.';return}
 $('msg').textContent=''; const m=MOVIES[cur],c=document.createElement('div'); c.className='card';
 c.innerHTML=`<img class="poster" src="${IMG+m.poster}" alt="Carátula de ${m.title}" draggable="false"><div class="fallback"><span class="emoji">${m.emoji}</span><b>${m.title}</b></div><div class="posterShade"></div><span class="num">${cur+1}/${N}</span><span class="tag l">VISTA</span><span class="tag r">PENDIENTE</span><div class="meta"><h2>${m.title}</h2><p><span class="year">${m.year}</span> ${m.emoji}</p></div>`;
 const img=c.querySelector('.poster'); img.onerror=()=>posterError(img); stage.appendChild(c); drag(c);
}
function act(seenIt){if(cur<0)return;hist.push([cur,seen.has(cur)]);if(seenIt){seen.add(cur);save()}cur=nextIdx(cur);show()}
function fly(c,dir,cb){c.style.transition='transform .25s ease,opacity .25s ease';c.style.transform=`translateX(${dir*520}px) rotate(${dir*28}deg)`;c.style.opacity=0;setTimeout(cb,230)}
function drag(c){let x0=null,dx=0;const l=c.querySelector('.l'),r=c.querySelector('.r');c.onpointerdown=e=>{x0=e.clientX;c.setPointerCapture(e.pointerId);c.style.transition='none'};c.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;l.style.opacity=dx<0?Math.min(1,-dx/95):0;r.style.opacity=dx>0?Math.min(1,dx/95):0};c.onpointerup=c.onpointercancel=()=>{if(x0===null)return;x0=null;if(Math.abs(dx)>95){const d=dx<0?-1:1;fly(c,d,()=>act(d<0))}else{c.style.transition='transform .2s';c.style.transform='';l.style.opacity=r.style.opacity=0}dx=0}}
$('bSeen').onclick=()=>{const c=stage.querySelector('.card');if(c)fly(c,-1,()=>act(true))};
$('bNo').onclick=()=>{const c=stage.querySelector('.card');if(c)fly(c,1,()=>act(false))};
$('bUndo').onclick=()=>{const h=hist.pop();if(!h)return;cur=h[0];if(!h[1]){seen.delete(cur);save()}show()};
function renderList(){const L=$('listView');const pct=Math.round((seen.size/N)*100);L.innerHTML=`<div class="listTop"><div class="progress"><i style="width:${pct}%"></i></div><div class="summary"><span>${seen.size} vistas</span><span>${N-seen.size} pendientes</span></div></div>`;MOVIES.forEach((m,i)=>{const d=document.createElement('div');d.className='movieRow';d.innerHTML=`<img class="thumb" src="${IMG+m.poster}" alt=""><div class="rowText"><b>${m.title}</b><small>${m.year}</small></div><span class="status ${seen.has(i)?'seen':''}">${seen.has(i)?'✓ Vista':'Pendiente'}</span>`;const img=d.querySelector('img');img.onerror=()=>{img.style.visibility='hidden'};d.onclick=()=>{seen.has(i)?seen.delete(i):seen.add(i);save();renderList();count()};L.appendChild(d)});const b=document.createElement('button');b.className='reset';b.textContent='Reiniciar todo';b.onclick=()=>{if(confirm('¿Marcar todas como pendientes?')){seen.clear();hist=[];save();cur=nextIdx(-1);renderList();count()}};L.appendChild(b);const cr=document.createElement('div');cr.className='credit';cr.innerHTML='Carátulas servidas por TMDB. Este producto usa datos/imágenes de TMDB pero no está respaldado ni certificado por TMDB.';L.appendChild(cr)}
function tab(list){$('listView').style.display=list?'block':'none';$('cardsView').style.display=list?'none':'flex';$('tList').className=list?'on':'';$('tCards').className=list?'':'on';if(list)renderList();else{if(cur<0||seen.has(cur))cur=nextIdx(cur<0?-1:cur);show()}}
$('tCards').onclick=()=>tab(false);$('tList').onclick=()=>tab(true);cur=nextIdx(-1);show();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
