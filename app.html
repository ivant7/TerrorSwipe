<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Terror Swipe</title>
<style>
:root{--bg:#100d12;--fg:#f7f1f8;--mut:#a99dac;--ok:#36b66b;--no:#e05245;--line:rgba(255,255,255,.12);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% -10%,#34203a 0,#160f19 35%,var(--bg) 70%);color:var(--fg)}body{overflow:hidden}.app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;gap:12px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:var(--mut);margin:3px 0 0}.tabs{display:flex;gap:6px;background:#ffffff0e;padding:4px;border-radius:999px}.tabs button{border:0;background:transparent;color:var(--mut);border-radius:999px;padding:7px 11px;font-weight:700}.tabs button.on{background:#fff;color:#171219}#cardsView{flex:1;min-height:0;display:flex;flex-direction:column}#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 18px}.card{position:absolute;width:min(calc(100% - 36px),350px);height:min(calc(100% - 16px),525px);max-height:72dvh;border-radius:26px;overflow:hidden;box-shadow:0 18px 50px #0008;touch-action:pan-y;user-select:none;border:1px solid #ffffff1c}.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#251f28}.shade{position:absolute;inset:0;background:linear-gradient(to bottom,#0000 35%,#0004 58%,#000e 100%)}.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:linear-gradient(155deg,#57233d,#19141c);padding:28px;text-align:center}.fallback .emoji{font-size:86px}.fallback b{font-size:25px}.meta{position:absolute;left:20px;right:20px;bottom:20px;text-shadow:0 2px 10px #000}.meta h2{font-size:27px;line-height:1.05;margin:0 0 7px}.meta p{margin:0;color:#e2d9e5}.year{border:1px solid #ffffff73;padding:3px 7px;border-radius:999px;margin-right:6px}.num{position:absolute;top:14px;right:14px;background:#0009;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.tag{position:absolute;top:34px;font-weight:900;font-size:24px;border:3px solid;border-radius:10px;padding:4px 10px;opacity:0;background:#0005}.tag.l{left:18px;color:#6eff9f;transform:rotate(-12deg)}.tag.r{right:18px;color:#ff8278;transform:rotate(12deg)}#msg{text-align:center;color:var(--mut);font-weight:700}.hint{text-align:center;color:var(--mut);font-size:11px;padding:0 16px 5px}.bar{display:grid;grid-template-columns:1fr 54px 1fr;gap:10px;padding:8px 16px 16px}.bar button{border:0;border-radius:18px;min-height:52px;color:#fff;font-weight:850}#bSeen{background:var(--ok)}#bNo{background:var(--no)}#bUndo{background:#625866;font-size:21px}#listView{display:none;flex:1;min-height:0;overflow:auto;padding:4px 14px 24px}.listTop{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 2px 12px}.progress{height:8px;background:#ffffff14;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#f17148,#d84d75)}.summary{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:7px}.movieRow{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line)}.thumb{width:54px;height:78px;border-radius:9px;object-fit:cover;background:#2b242d}.rowText b{display:block;font-size:14px}.rowText small{color:var(--mut)}.status{font-size:12px;font-weight:800;border:1px solid var(--line);padding:6px 8px;border-radius:999px;color:var(--mut)}.status.seen{color:#80e8a6}.reset{display:block;margin:18px auto;border:1px solid #e0524588;background:transparent;color:#ff8278;border-radius:999px;padding:9px 14px;font-weight:750}.credit{text-align:center;color:#786d7c;font-size:10px;line-height:1.35;margin:16px auto 4px;max-width:310px}
</style></head><body><div class="app"><header><div class="brand"><h1>🎃 Terror Swipe</h1><p id="cnt"></p></div><div class="tabs"><button id="tCards" class="on">Tarjetas</button><button id="tList">Lista</button></div></header><section id="cardsView"><div id="stage"><div id="msg"></div></div><div class="hint">Desliza ← si la has visto · → si queda pendiente</div><div class="bar"><button id="bSeen">← Vista</button><button id="bUndo">↺</button><button id="bNo">Pendiente →</button></div></section><section id="listView"></section></div>
<script>
const IMG='https://image.tmdb.org/t/p/w500';
const M=[['Pesadilla antes de Navidad',1993,'🎄','/kBwmwfQEkObrnsc6whcNE5Kh2Wr.jpg'],['American Psycho',2000,'🪓','/193HQFVEhkWywhGjvu9R1FiikqP.jpg'],['Scream',1996,'🔪','/lr9ZIrmuwVmZhpZuTCW8D9g0ZJe.jpg'],['La familia Addams',1991,'🕸️','/sFwaszCIbVXGnsJG6dg6WUY7d6P.jpg'],['Se lo hicisteis el último verano',1997,'🎣','/nBXwFJOp3Qlmk6ZDKl1PLCDh0FC.jpg'],['Monster House',2006,'🏚️','/4urWOtrhlS9Oz4DPtubje4VAwko.jpg'],['Pesadilla en Elm Street',1984,'🧤','/wGTpGGRMZmyFCcrY2YoxVTIBlli.jpg'],['La matanza de Texas',1974,'⛓️','/9s8uSm5K1W0vhGPHv2icM6SFib8.jpg'],['Viernes 13',1980,'🏒','/o1NuePMWEBuqsJgpkCNJjl2YbuL.jpg'],['It',2017,'🎈','/9E2y5Q7WlCVNEhP5GiVTjhEhx1o.jpg'],['Coraline',2009,'🪡','/4jeFXQYytChdZYE9JYO7Un87IlW.jpg'],['Truco o trato',2007,'🍬','/webZHgUQZ7xAH8zYxvrn9PRubbj.jpg'],['Hereditary',2018,'👑','/6chE8jSfzggAudaHmKodzBz8Sl.jpg'],['La novia cadáver',2005,'💀','/3ALM0VeZjGUryAqWo6pqohzbLDh.jpg'],['Eduardo Manostijeras',1990,'✂️','/e0FqKFvGPdQNWG8tF9cZBtev9Em.jpg'],['Us',2019,'🐰','/tzYh66Yks8moOI5jMzSeDqLjLgj.jpg'],['Mary Shelley',2017,'⚡','/keF84Cc8Ds2pqbaGVW0lor0xA4.jpg'],['Saw',2004,'🧩','/8UZvCj5zTr0Kydjgenw6Rl0VHoo.jpg'],['Sombras tenebrosas (Sleepy Hollow)',1999,'🎃','/1GuK965FLJxqUw9fd1pmvjbFAlv.jpg'],['Los otros',2001,'🕯️','/p8g1vlTvpM6nr2hMMiZ1fUlKF0D.jpg'],['The Ring',2002,'📼','/4TPPSB8OAtgYo9EdFzr7tsTsLDB.jpg'],['It Follows',2014,'🚶','/iwnQ1JH1wdWrGYkgWySptJ5284A.jpg'],['El silencio de los corderos',1991,'🦋','/uS9m8OBk1A8eM9I042bx8XXpqAq.jpg'],['Barbarian',2022,'🚪','/idT5mnqPcJgSkvpDX7pJffBzdVH.jpg'],['Verónica',2017,'🔮','/lU2HL58AWbQ8bWSyc7mqyDxkdvt.jpg'],['Candyman',1992,'🐝','/n38YbNqUf5KWpMJFc4X3t0rlhg5.jpg'],['Psicosis',1960,'🚿','/3md49VBCeqY6MSNyAVY6d5eC6bA.jpg'],['El resplandor',1980,'🪓','/yQ7AR0T0dFJcEfR9g4J8vyeiHCl.jpg'],['Drácula',1992,'🧛','/n39glC4GkBeCbwdenES8ZBodim8.jpg'],['Noche de Halloween',1978,'🔦','/wijlZ3HaYMvlDTPqJoTCWKFkCPU.jpg'],['Expediente Warren',2013,'✝️','/wVYREutTvI2tmxr6ujrHT704wGF.jpg']];
const N=M.length,$=id=>document.getElementById(id),stage=$('stage');let seen=new Set(),cur=-1,hist=[];try{seen=new Set(JSON.parse(localStorage.getItem('seen')||'[]'))}catch(e){}function save(){localStorage.setItem('seen',JSON.stringify([...seen]))}function next(from){for(let k=1;k<=N;k++){let i=(from+k)%N;if(!seen.has(i))return i}return-1}function count(){$('cnt').textContent=`${seen.size}/${N} vistas`}function show(){stage.querySelectorAll('.card').forEach(x=>x.remove());count();if(cur<0||seen.size===N){$('msg').textContent=seen.size===N?'¡Las has visto todas! 🎉':'';return}let m=M[cur],c=document.createElement('div');c.className='card';c.innerHTML=`<img class="poster" src="${IMG+m[3]}"><div class="fallback"><span class="emoji">${m[2]}</span><b>${m[0]}</b></div><div class="shade"></div><span class="num">${cur+1}/${N}</span><span class="tag l">VISTA</span><span class="tag r">PENDIENTE</span><div class="meta"><h2>${m[0]}</h2><p><span class="year">${m[1]}</span>${m[2]}</p></div>`;let im=c.querySelector('.poster');im.onerror=()=>{im.style.display='none';c.querySelector('.fallback').style.display='flex'};stage.appendChild(c);drag(c)}function act(y){if(cur<0)return;hist.push([cur,seen.has(cur)]);if(y){seen.add(cur);save()}cur=next(cur);show()}function fly(c,d,cb){c.style.transition='transform .25s,opacity .25s';c.style.transform=`translateX(${d*520}px) rotate(${d*28}deg)`;c.style.opacity=0;setTimeout(cb,230)}function drag(c){let x0=null,dx=0,l=c.querySelector('.l'),r=c.querySelector('.r');c.onpointerdown=e=>{x0=e.clientX;c.setPointerCapture(e.pointerId);c.style.transition='none'};c.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;l.style.opacity=dx<0?Math.min(1,-dx/95):0;r.style.opacity=dx>0?Math.min(1,dx/95):0};c.onpointerup=c.onpointercancel=()=>{if(x0===null)return;x0=null;if(Math.abs(dx)>95){let d=dx<0?-1:1;fly(c,d,()=>act(d<0))}else{c.style.transition='transform .2s';c.style.transform='';l.style.opacity=r.style.opacity=0}dx=0}}$('bSeen').onclick=()=>{let c=stage.querySelector('.card');if(c)fly(c,-1,()=>act(true))};$('bNo').onclick=()=>{let c=stage.querySelector('.card');if(c)fly(c,1,()=>act(false))};$('bUndo').onclick=()=>{let h=hist.pop();if(!h)return;cur=h[0];if(!h[1]){seen.delete(cur);save()}show()};function renderList(){let L=$('listView'),pct=Math.round(seen.size/N*100);L.innerHTML=`<div class="listTop"><div class="progress"><i style="width:${pct}%"></i></div><div class="summary"><span>${seen.size} vistas</span><span>${N-seen.size} pendientes</span></div></div>`;M.forEach((m,i)=>{let d=document.createElement('div');d.className='movieRow';d.innerHTML=`<img class="thumb" src="${IMG+m[3]}"><div class="rowText"><b>${m[0]}</b><small>${m[1]}</small></div><span class="status ${seen.has(i)?'seen':''}">${seen.has(i)?'✓ Vista':'Pendiente'}</span>`;d.onclick=()=>{seen.has(i)?seen.delete(i):seen.add(i);save();renderList();count()};L.appendChild(d)});let b=document.createElement('button');b.className='reset';b.textContent='Reiniciar todo';b.onclick=()=>{if(confirm('¿Marcar todas como pendientes?')){seen.clear();hist=[];save();cur=next(-1);renderList();count()}};L.appendChild(b);let cr=document.createElement('div');cr.className='credit';cr.textContent='Carátulas servidas por TMDB. Este producto usa datos/imágenes de TMDB pero no está respaldado ni certificado por TMDB.';L.appendChild(cr)}function tab(list){$('listView').style.display=list?'block':'none';$('cardsView').style.display=list?'none':'flex';$('tList').className=list?'on':'';$('tCards').className=list?'':'on';if(list)renderList();else{if(cur<0||seen.has(cur))cur=next(cur<0?-1:cur);show()}}$('tCards').onclick=()=>tab(false);$('tList').onclick=()=>tab(true);cur=next(-1);show();
</script></body></html>
